name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changed:
              - backend/**
              - search-svc/**
              - frontend/**
              - .env.example
              - pyproject.toml
              - bun.lock
              - package.json
              - compose*.yml
              - .github/workflows/test-docker-compose.yml

  test-docker-compose:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create .env from the committed example
        run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend search-svc frontend adminer proxy
      - name: Test backend is up
        run: curl -fsS http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl -fsS http://localhost:5173
      - name: Verify Traefik routes search and backend paths
        run: |
          access_token="$(
            curl -fsS \
              -H 'Host: api.localhost' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data 'username=admin@example.com&password=changethis' \
              http://localhost/api/v1/login/access-token \
              | jq -r .access_token
          )"
          curl -fsS \
            -H 'Host: api.localhost' \
            -H "Authorization: Bearer ${access_token}" \
            'http://localhost/api/v1/search/files?folder_path=root' \
            | jq -e '.results == [] and .next_cursor == null'
          curl -fsS \
            -H 'Host: api.localhost' \
            http://localhost/api/v1/utils/health-check
      - name: Verify search service has no PostgreSQL credentials
        run: |
          if docker compose exec -T search-svc env | grep -q '^POSTGRES_'; then
            echo 'search-svc must not receive POSTGRES_* variables'
            exit 1
          fi
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v --remove-orphans

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-docker-compose: # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - changes
      - test-docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-docker-compose
