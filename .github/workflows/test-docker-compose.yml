name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changed:
              - backend/**
              - frontend/**
              - .env.example
              - pyproject.toml
              - bun.lock
              - package.json
              - compose*.yml
              - .github/workflows/test-docker-compose.yml

  test-docker-compose:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create .env from the committed example
        run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl -fsS http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl -fsS http://localhost:5173
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v --remove-orphans

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-docker-compose: # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - changes
      - test-docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-docker-compose
