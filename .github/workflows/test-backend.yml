name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changed:
              - backend/**
              - .env.example
              - pyproject.toml
              - uv.lock
              - .github/workflows/test-backend.yml

  lint-backend:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        run: uv sync
        working-directory: backend
      - name: Run backend lint and type checks
        run: uv run bash scripts/lint.sh
        working-directory: backend

  test-backend:
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create .env from the committed example
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # No `docker compose up db` and no migrate step: the suite starts its own
      # throwaway PostgreSQL container via testcontainers and migrates it.
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      # No compose teardown either: this job no longer starts any compose
      # service, and testcontainers removes the container it created.
      - name: Store coverage files
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-backend: # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - changes
      - lint-backend
      - test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint-backend, test-backend
