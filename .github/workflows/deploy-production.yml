name: Deploy to Production

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    env:
      ENVIRONMENT: production
      DOMAIN: ${{ secrets.DOMAIN_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      DOCKER_IMAGE_SEARCH: ${{ secrets.DOCKER_IMAGE_SEARCH }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      QUOTA_DEFAULT_BYTES: ${{ secrets.QUOTA_DEFAULT_BYTES }}
      QUOTA_NOTIFY_THRESHOLD_PERCENT: ${{ secrets.QUOTA_NOTIFY_THRESHOLD_PERCENT }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID_PRODUCTION }}
      FCM_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON_BASE64_PRODUCTION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Supplies the non-secret defaults Compose interpolates. Secrets come from
      # the job env above, which takes precedence over the .env file. `-n` keeps
      # an operator-managed .env on the self-hosted runner intact.
      - name: Create .env from the committed example
        run: cp -n .env.example .env
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} build
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} up -d
