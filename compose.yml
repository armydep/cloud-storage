name: cfs
services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD?Variable not set}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Single node (decision 3 in docs/phases/phase-10-search-service.md):
  # clustering, replicas and snapshot/restore are explicitly out of scope.
  # No ingress -- reachable only by search-indexer and search-svc on the
  # internal network, never through Traefik, and no port is published here
  # (compose.override.yml publishes one for local debugging only).
  #
  # Resource floor: 512m/512m heap plus xpack.security.enabled=false, since
  # this node has no ingress to protect and TLS/auth would need certificates
  # and credentials this design never introduces. Linux hosts need
  # `vm.max_map_count` raised to at least 262144
  # (`sudo sysctl -w vm.max_map_count=262144`) or Elasticsearch fails to
  # start with no client-visible error -- a container that never becomes
  # healthy is the symptom.
  elasticsearch:
    image: elasticsearch:8.17.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 10
      start_period: 60s
      timeout: 10s
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND:?Variable not set}:${TAG:-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - BACKEND_WORKERS=${BACKEND_WORKERS:-4}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - S3_CONNECT_TIMEOUT_SECONDS=${S3_CONNECT_TIMEOUT_SECONDS:-3}
      - S3_READ_TIMEOUT_SECONDS=${S3_READ_TIMEOUT_SECONDS:-30}
      - S3_MAX_ATTEMPTS=${S3_MAX_ATTEMPTS:-3}
      - SENTRY_DSN=${SENTRY_DSN}

  backend:
    image: '${DOCKER_IMAGE_BACKEND:?Variable not set}:${TAG:-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - BACKEND_WORKERS=${BACKEND_WORKERS:-4}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - S3_CONNECT_TIMEOUT_SECONDS=${S3_CONNECT_TIMEOUT_SECONDS:-3}
      - S3_READ_TIMEOUT_SECONDS=${S3_READ_TIMEOUT_SECONDS:-30}
      - S3_MAX_ATTEMPTS=${S3_MAX_ATTEMPTS:-3}
      - SENTRY_DSN=${SENTRY_DSN}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  search-svc:
    image: '${DOCKER_IMAGE_SEARCH:?Variable not set}:${TAG:-latest}'
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
        restart: true
    networks:
      - traefik-public
      - default
    environment:
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      # Not used by this service's own request path (only search-indexer
      # consumes RabbitMQ) -- required anyway because Settings is shared
      # between the two and RABBITMQ_USER/PASSWORD have no default, matching
      # backend/app/core/config.py's own RabbitMQ fields.
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    build:
      context: .
      dockerfile: search-svc/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-search.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-search.rule=Host(`api.${DOMAIN?Variable not set}`) && PathPrefix(`/api/v1/search`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-search.priority=100
      - traefik.http.routers.${STACK_NAME?Variable not set}-search.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-search.middlewares=https-redirect

      - traefik.http.routers.${STACK_NAME?Variable not set}-search-https.rule=Host(`api.${DOMAIN?Variable not set}`) && PathPrefix(`/api/v1/search`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-search-https.priority=100
      - traefik.http.routers.${STACK_NAME?Variable not set}-search-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-search-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-search-https.tls.certresolver=le

  search-indexer:
    image: '${DOCKER_IMAGE_SEARCH:?Variable not set}:${TAG:-latest}'
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
    command: python -m app.indexer
    environment:
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    build:
      context: .
      dockerfile: search-svc/Dockerfile

  notification-relay:
    image: '${DOCKER_IMAGE_BACKEND:?Variable not set}:${TAG:-latest}'
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
        restart: true
    command: python -m app.notifications.relay
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}

  notification-consumer:
    image: '${DOCKER_IMAGE_BACKEND:?Variable not set}:${TAG:-latest}'
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
    command: python -m app.notifications.consumer
    env_file:
      - .env
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}

  notification-inapp-consumer:
    image: '${DOCKER_IMAGE_BACKEND:?Variable not set}:${TAG:-latest}'
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
        restart: true
    command: python -m app.notifications.inapp_consumer
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER?Variable not set}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND:?Variable not set}:${TAG:-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
volumes:
  app-db-data:
  rabbitmq-data:
  elasticsearch-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
