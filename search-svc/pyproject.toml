[project]
name = "search-svc"
version = "0.1.0"
description = "Cloud File Storage search service"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "pika>=1.4.4",
    "elasticsearch>=8.14,<9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.25.1,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pytest>=7.4.3,<9.0.0",
    "ruff>=0.16.1,<1.0.0",
    "testcontainers[elasticsearch]>=4.0,<5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG001",
    "T201",
]
ignore = [
    "E501",
    "B008",
    "W191",
    "B904",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
