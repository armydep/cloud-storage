# Overlay for local, isolated Playwright runs — see scripts/test-e2e-local.sh.
#
# `docker compose -p <name>` alone separates containers, volumes and networks
# from a developer's own `docker compose watch` stack, but not host port
# publishing: compose.override.yml maps db/backend/mailcatcher/playwright to
# the same host ports (5432, 8000, ...) the dev stack is already using, so a
# second project would fail to start rather than coexist.
#
# None of those host ports are needed for this run: the `playwright` service
# reaches its dependencies over the compose-internal network by service name
# (e.g. http://backend:8000) regardless of what is or isn't published to the
# host. `!reset` (Compose Specification, supported since Compose 2.24) clears
# the inherited port list instead of appending to it.
services:
  db:
    ports: !reset []
  backend:
    ports: !reset []
  mailcatcher:
    ports: !reset []
  playwright:
    ports: !reset []
