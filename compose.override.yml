services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:v3.7
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      traefik-public:
      default:
        aliases:
          # Chromium maps *.localhost to the Playwright container's loopback
          # before Docker DNS can help, so both E2E entry points override
          # DOMAIN with a non-.localhost name. This alias resolves that name to
          # Traefik; the local runner also uses distinct router names so it
          # cannot collide with a concurrently running dev stack.
          - api.${DOMAIN?Variable not set}

  db:
    restart: "no"
    ports:
      - "5432:5432"

  rabbitmq:
    restart: "no"
    ports:
      - "5672:5672"
      - "15672:15672"

  # Local-only debugging access (curl http://localhost:9200) -- production
  # publishes no port at all (decision 9 in
  # docs/phases/phase-10-search-service.md).
  #
  # Elasticsearch needs `vm.max_map_count` raised on Linux hosts or it fails
  # to start with no client-visible error -- a container that never becomes
  # healthy is the only symptom. Run once per host, does not persist across
  # reboots: `sudo sysctl -w vm.max_map_count=262144`.
  elasticsearch:
    restart: "no"
    ports:
      - "9200:9200"

  adminer:
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"

  search-svc:
    restart: "no"
    build:
      context: .
      dockerfile: search-svc/Dockerfile
    develop:
      watch:
        - path: ./search-svc/app
          action: sync+restart
          target: /app/app
        - path: ./search-svc/pyproject.toml
          action: rebuild

  search-indexer:
    restart: "no"
    build:
      context: .
      dockerfile: search-svc/Dockerfile
    develop:
      watch:
        - path: ./search-svc/app
          action: sync+restart
          target: /app/app
        - path: ./search-svc/pyproject.toml
          action: rebuild

  notification-relay:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv

  notification-consumer:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"

  notification-inapp-consumer:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        mc mb -p local/${S3_BUCKET:-cloud-file-storage};
        printf '%s\n' \
          '{' \
          '  "CORSRules": [' \
          '    {' \
          '      "AllowedOrigins": ["*"],' \
          '      "AllowedMethods": ["GET", "PUT", "HEAD"],' \
          '      "AllowedHeaders": ["*"],' \
          '      "ExposeHeaders": ["ETag", "x-amz-checksum-sha256"],' \
          '      "MaxAgeSeconds": 3000' \
          '    }' \
          '  ]' \
          '}' \
          > /tmp/cors.json;
        mc cors set local/${S3_BUCKET:-cloud-file-storage} /tmp/cors.json;
        exit 0;

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Normal local browser traffic goes through Traefik, just as it does in
        # production. The backend's published port remains available for direct
        # debugging, but is not the frontend API origin.
        - VITE_API_URL=http://api.${DOMAIN?Variable not set}
        - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        # E2E traffic must traverse Traefik: it owns the path rule that sends
        # /api/v1/search/* to search-svc. `proxy` provides this hostname as a
        # Docker network alias above. CI and the isolated local runner both use
        # a non-.localhost domain; the local runner additionally supplies a
        # unique STACK_NAME to avoid discovering same-named dev routers.
        - VITE_API_URL=http://api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
      - proxy
      - search-svc
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://api.${DOMAIN?Variable not set}
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false

volumes:
  minio-data:
